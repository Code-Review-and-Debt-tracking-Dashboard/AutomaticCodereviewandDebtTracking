name: Mobile OTA update

# pushes mobile JS to the preview APKs via EAS Update. native changes need a new APK.
# needs the EXPO_TOKEN secret

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

permissions:
  contents: read

# one at a time so the newest commit ends up last
concurrency:
  group: mobile-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npm run typecheck --workspace apps/mobile

      # commit message goes through env so it can't run as shell
      - name: Publish update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          npm run update --workspace apps/mobile -- \
            --message "${title:-Manual publish} (${GITHUB_SHA::7})" \
            --non-interactive
