name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Generates the Prisma Client into node_modules/@prisma/client.
      # That output is gitignored and CI starts from a clean node_modules
      # each run, so without this, `@codehealth/db` (and anything that
      # imports it, e.g. apps/api) fails to typecheck with
      # "Module '@prisma/client' has no exported member 'PrismaClient'".
      # No DATABASE_URL needed — `generate` only reads the schema.
      - run: npm run generate --workspace packages/db

      # Lint all workspaces. `--include-workspace-root` keeps this a safe
      # no-op (exit 0) until apps/*, packages/* get a package.json — without
      # it, `--workspaces` hard-fails with "No workspaces found!" today.
      - run: npm run lint --workspaces --include-workspace-root --if-present

      # TypeScript type checking
      - run: npm run typecheck --workspaces --include-workspace-root --if-present

  test:
    runs-on: ubuntu-latest

    # apps/api's integration tests run against real Postgres and Redis.
    # Ports match the defaults in apps/api/tests/setup/env.ts, which are
    # the same host ports docker-compose.yml maps locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_review_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/code_review_test
      TEST_REDIS_URL: redis://localhost:6380/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run generate --workspace packages/db

      - run: npm run test --workspace apps/worker

      - run: npm run test --workspace apps/api

  # Only on main, and only once both jobs above pass. Logs in to AWS with
  # OIDC (no stored keys), then pulls main and runs scripts/deploy.sh on the
  # server over SSM.
  deploy:
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # a second merge waits for the running deploy instead of racing it
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DOMAIN: ${{ vars.PROD_DOMAIN }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Run deploy.sh on the server
        run: |
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo -iu ubuntu git -C /home/ubuntu/AutomaticCodereviewandDebtTracking pull --ff-only origin main && sudo -iu ubuntu /home/ubuntu/AutomaticCodereviewandDebtTracking/scripts/deploy.sh"]' \
            --query Command.CommandId --output text)

          # aws ssm wait gives up after ~100s, a worker rebuild takes longer
          status=Pending
          for _ in $(seq 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "deploy status: $status"
          [ "$status" = Success ]

      - name: Health check
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://api.$DOMAIN/health"
